<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ねぎま</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>11期解神　解神セット　「ねぎま」</h1>
    <div id="start-screen">
      <p>注意事項</p>
      <ul class="rules">
        <li>肉とねぎが交互に出題されます。</li>
        <li>制限時間は３分で問題数は１５問です。</li>
        <li>できるだけ多く解いてください。</li>
        <li>スタートを押すとすぐ始まります。</li>
        <li>間違えてもパスするまではその問題が表示されます。</li>
        <li>一度パスしたら戻ってこれません。</li>
        <li>解答形式の指定（ひらがなとか）は問題画像下部の解答欄に書いてます。</li>
        <li>一部わかりづらい解答形式がありますが空気読んでください。</li>
        <li>多分難しめ？なので頑張ってください。</li>
      </ul>
      <button onclick="startQuiz()">スタート</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div id="timer">残り時間: 180秒</div>
      <div id="question"></div>
      <input type="text" id="answer" placeholder="答えを入力..." />
      <button onclick="submitAnswer()">回答</button>
      <button onclick="passQuestion()">パス</button>
    </div>

    <div id="result" class="hidden"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
